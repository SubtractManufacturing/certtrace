name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      desktop_release_created: ${{ steps.release.outputs['apps/desktop--release_created'] }}
      desktop_tag_name: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  dispatch-release-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop_release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          DESKTOP_TAG_NAME: ${{ needs.release-please.outputs.desktop_tag_name }}
        with:
          script: |
            const tagName = process.env.DESKTOP_TAG_NAME;
            if (!tagName) {
              core.setFailed('Missing apps/desktop--tag_name from release-please.');
              return;
            }
            if (!tagName.startsWith('desktop-v')) {
              core.setFailed(`Unsupported desktop tag: ${tagName}. Expected a desktop-v* tag.`);
              return;
            }

            const desktopVersion = tagName.replace(/^desktop-v/, '');
            const releaseName = `CertTrace Desktop: v${desktopVersion}`;

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            core.info(`Renaming ${tagName} release to ${releaseName}`);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: releaseName,
            });

            core.info(`Dispatching release build for ${tagName}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                tag: tagName,
              },
            });
