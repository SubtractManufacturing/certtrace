name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  dispatch-release-build:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });

            const desktopRelease = releases.find((release) =>
              release.tag_name.startsWith('desktop-v')
            );

            if (!desktopRelease) {
              core.info('No desktop release found; skipping build dispatch.');
              return;
            }

            const desktopVersion = desktopRelease.tag_name.replace(/^desktop-v/, '');
            const releaseName = `CertTrace Desktop: v${desktopVersion}`;

            core.info(`Renaming ${desktopRelease.tag_name} release to ${releaseName}`);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: desktopRelease.id,
              name: releaseName,
            });

            core.info(`Dispatching release build for ${desktopRelease.tag_name}`);

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                tag: desktopRelease.tag_name,
              },
            });
