name: Release

# Only workflow_dispatch — release-please.yml dispatches once when a desktop
# release is created. Do not also listen for `release: published` or a PAT-backed
# release-please run would start a second ship build for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example desktop-v1.0.0)
        required: true

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/github-script@v9
        id: release
        with:
          script: |
            const tagName = '${{ inputs.tag }}';
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            if (!tagName.startsWith('desktop-v')) {
              core.setFailed(`Unsupported release tag: ${tagName}. Expected a desktop-v* tag.`);
              return;
            }

            core.setOutput('tag_name', tagName);
            core.setOutput('release_id', String(release.id));
            core.setOutput('release_name', release.name ?? tagName);
            core.setOutput('release_body', release.body ?? '');

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve-release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            # Universal binary: Apple Silicon + Intel from one macos-latest job
            args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":true}}'
          - os: windows-latest
            platform: windows
            args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          - os: ubuntu-latest
            platform: linux
            args: '--config {"bundle":{"createUpdaterArtifacts":true}}'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version
        run: pnpm sync:version

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.resolve-release.outputs.tag_name }}
          releaseName: ${{ needs.resolve-release.outputs.release_name }}
          releaseBody: ${{ needs.resolve-release.outputs.release_body }}
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  notify-discord:
    name: Notify Discord
    needs: [resolve-release, build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait until release-ready and post Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          RELEASE_READY_AGE_SEC = 30 * 60
          POLL_INTERVAL_SEC = 60
          DISCORD_DESC_LIMIT = 4096
          EMBED_COLOR = 3447003
          USER_AGENT = (
              "CertTrace-ReleaseNotify/1.0 "
              "(https://github.com/SubtractManufacturing/certtrace)"
          )

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          tag_name = os.environ["TAG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")

          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not set", file=sys.stderr)
              sys.exit(1)

          if not tag_name.startswith("desktop-v"):
              print(f"Unsupported tag: {tag_name}", file=sys.stderr)
              sys.exit(1)

          version = tag_name.removeprefix("desktop-v")
          owner, repo_name = repo.split("/", 1)

          def http_json(url, headers=None):
              merged = {"User-Agent": USER_AGENT, **(headers or {})}
              request = urllib.request.Request(url, headers=merged)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def parse_pub_date(pub_date_str):
              return datetime.fromisoformat(pub_date_str.replace("Z", "+00:00"))

          def seconds_until_release_ready(pub_date):
              ready_at = pub_date + timedelta(seconds=RELEASE_READY_AGE_SEC)
              return (ready_at - datetime.now(timezone.utc)).total_seconds()

          latest_json_url = (
              f"https://github.com/{repo}/releases/download/{tag_name}/latest.json"
          )

          while True:
              print(f"Fetching {latest_json_url}")
              latest = http_json(latest_json_url)

              pub_date_str = latest.get("pub_date")
              if not pub_date_str:
                  print("latest.json is missing pub_date", file=sys.stderr)
                  sys.exit(1)

              remaining = seconds_until_release_ready(parse_pub_date(pub_date_str))
              if remaining <= 0:
                  print("Release is ready (pub_date + 30m has elapsed)")
                  break

              sleep_for = min(POLL_INTERVAL_SEC, remaining)
              print(
                  f"Release not ready yet; {remaining:.0f}s remaining "
                  f"(polling again in {sleep_for:.0f}s)"
              )
              time.sleep(sleep_for)

          release_api_url = (
              f"https://api.github.com/repos/{owner}/{repo_name}/releases/tags/{tag_name}"
          )
          release = http_json(
              release_api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          release_body = (release.get("body") or "").strip()
          release_url = f"https://github.com/{repo}/releases/tag/{tag_name}"

          description = release_body
          if len(description) > DISCORD_DESC_LIMIT:
              description = description[: DISCORD_DESC_LIMIT - 1] + "…"

          payload = {
              "username": "CertTrace",
              "embeds": [
                  {
                      "title": f"Version {version} is now available",
                      "description": description,
                      "url": release_url,
                      "color": EMBED_COLOR,
                  }
              ],
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              webhook_url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": USER_AGENT,
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord responded HTTP {response.status}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(
                  f"Discord webhook failed: HTTP {error.code} {body}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PYTHON
