name: Release

# Only workflow_dispatch — release-please.yml dispatches once when a desktop
# release is created. Do not also listen for `release: published` or a PAT-backed
# release-please run would start a second ship build for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example desktop-v1.0.0)
        required: true

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/github-script@v9
        id: release
        with:
          script: |
            const tagName = '${{ inputs.tag }}';
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            if (!tagName.startsWith('desktop-v')) {
              core.setFailed(`Unsupported release tag: ${tagName}. Expected a desktop-v* tag.`);
              return;
            }

            core.setOutput('tag_name', tagName);
            core.setOutput('release_id', String(release.id));
            core.setOutput('release_name', release.name ?? tagName);
            core.setOutput('release_body', release.body ?? '');

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve-release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            # Universal binary: Apple Silicon + Intel from one macos-latest job
            args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":true}}'
          - os: windows-latest
            platform: windows
            args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          - os: ubuntu-latest
            platform: linux
            args: '--config {"bundle":{"createUpdaterArtifacts":true}}'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version
        run: pnpm sync:version

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.resolve-release.outputs.tag_name }}
          releaseName: ${{ needs.resolve-release.outputs.release_name }}
          releaseBody: ${{ needs.resolve-release.outputs.release_body }}
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
