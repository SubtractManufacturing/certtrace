name: Release

# Only workflow_dispatch — release-please.yml dispatches once when a desktop
# release is created. Do not also listen for `release: published` or a PAT-backed
# release-please run would start a second ship build for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example desktop-v1.0.0)
        required: true

jobs:
  resolve-release:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    # Draft releases are only listed for tokens with write access.
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/github-script@v9
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tagName = process.env.INPUT_TAG;

            if (!tagName.startsWith('desktop-v')) {
              core.setFailed(`Unsupported release tag: ${tagName}. Expected a desktop-v* tag.`);
              return;
            }

            // Release Please creates releases as drafts (see release-please-config.json)
            // and getReleaseByTag cannot see drafts, so list and match on the tag.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const release = releases.find((r) => r.tag_name === tagName);
            if (!release) {
              core.setFailed(`No release (draft or published) found for tag ${tagName}.`);
              return;
            }

            core.setOutput('tag_name', tagName);
            core.setOutput('release_id', String(release.id));
            core.setOutput('release_name', release.name ?? tagName);
            core.setOutput('release_body', release.body ?? '');

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve-release
    permissions:
      contents: write
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            # Universal binary: Apple Silicon + Intel from one macos-latest job
            args: '--target universal-apple-darwin --config {"bundle":{"createUpdaterArtifacts":true}}'
          - os: windows-latest
            platform: windows
            args: "--config signing-config.windows.json"
          - os: ubuntu-latest
            platform: linux
            args: '--config {"bundle":{"createUpdaterArtifacts":true}}'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal build targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version
        run: pnpm sync:version

      - name: Azure login (Windows Authenticode)
        if: matrix.platform == 'windows'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign tool (Windows Authenticode)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # sign is prerelease-only on NuGet.org today. Pinned: an unpinned install
          # picked up 0.9.1-beta.26552.4 and Windows signing started failing in the
          # v0.0.8 release. Bump deliberately, after a successful release.
          dotnet tool install -g sign --version 0.9.1-beta.26431.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Windows Authenticode signing config
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: apps/desktop
        run: |
          # Object-form signCommand: string form is shell-split and breaks with
          # "failed to run powershell" when the command itself is powershell.
          $script = (Resolve-Path 'src-tauri/scripts/sign-windows.ps1').Path
          $config = @{
            bundle = @{
              createUpdaterArtifacts = $true
              windows = @{
                signCommand = @{
                  cmd = 'powershell'
                  args = @(
                    '-NoProfile'
                    '-ExecutionPolicy'
                    'Bypass'
                    '-File'
                    $script
                    '%1'
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 6 -Compress
          Set-Content -Path signing-config.windows.json -Value $config

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.resolve-release.outputs.tag_name }}
          releaseName: ${{ needs.resolve-release.outputs.release_name }}
          releaseBody: ${{ needs.resolve-release.outputs.release_body }}
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Tauri hides the signCommand's output; sign-windows.ps1 logs it to a file.
      - name: Show Windows signing log
        if: failure() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sign-windows.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No signing log at $log" }

  # Release Please publishes releases as drafts. The release only goes public
  # here, once every platform's installer and updater signature is attached
  # and latest.json lists every platform. If any build fails this job is
  # skipped and the release stays a draft, so users never see a partial one.
  publish:
    name: Verify assets and publish
    needs: [resolve-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = process.env.TAG_NAME;
            const releaseId = Number(process.env.RELEASE_ID);
            const version = tagName.replace(/^desktop-v/, '');

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });
            const assets = new Map(release.assets.map((a) => [a.name, a]));

            const installers = [
              `CertTrace_${version}_universal.dmg`,
              `CertTrace_${version}_x64-setup.exe`,
              `CertTrace_${version}_x64_en-US.msi`,
              `CertTrace_${version}_amd64.deb`,
              `CertTrace-${version}-1.x86_64.rpm`,
              `CertTrace_${version}_amd64.AppImage`,
            ];
            const updaterBundles = [
              `CertTrace_${version}_universal.app.tar.gz`,
              `CertTrace_${version}_x64-setup.exe`,
              `CertTrace_${version}_x64_en-US.msi`,
              `CertTrace_${version}_amd64.deb`,
              `CertTrace-${version}-1.x86_64.rpm`,
              `CertTrace_${version}_amd64.AppImage`,
            ];
            const required = [
              ...installers,
              ...updaterBundles,
              ...updaterBundles.map((n) => `${n}.sig`),
              'latest.json',
            ];

            const problems = [];
            for (const name of new Set(required)) {
              const asset = assets.get(name);
              if (!asset) problems.push(`missing asset: ${name}`);
              else if (asset.state !== 'uploaded' || asset.size === 0) {
                problems.push(`asset not fully uploaded: ${name} (${asset.state}, ${asset.size} bytes)`);
              }
            }

            const latestAsset = assets.get('latest.json');
            if (latestAsset) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: latestAsset.id, headers: { accept: 'application/octet-stream' } },
              );
              const latest = JSON.parse(Buffer.from(data).toString('utf8'));
              if (latest.version !== version) {
                problems.push(`latest.json version is ${latest.version}, expected ${version}`);
              }
              for (const key of ['linux-x86_64', 'darwin-aarch64', 'darwin-x86_64', 'windows-x86_64']) {
                const entry = latest.platforms?.[key];
                if (!entry?.url || !entry?.signature) {
                  problems.push(`latest.json is missing platform ${key}`);
                }
              }
            }

            if (problems.length > 0) {
              core.setFailed(
                `Release ${tagName} is incomplete; leaving it unpublished.\n` +
                  problems.map((p) => `  - ${p}`).join('\n'),
              );
              return;
            }

            if (release.draft) {
              // Without tag_name, updating a draft resets its tag to "untagged-...".
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: releaseId,
                tag_name: tagName,
                draft: false,
                make_latest: 'true',
              });
              core.info(`Published ${tagName}`);
            } else {
              core.info(`${tagName} was already published; all assets verified.`);
            }

  notify-discord:
    name: Notify Discord
    needs: [resolve-release, publish]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Wait until release-ready and post Discord embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          RELEASE_READY_AGE_SEC = 30 * 60
          POLL_INTERVAL_SEC = 60
          DISCORD_DESC_LIMIT = 4096
          EMBED_COLOR = 3447003
          USER_AGENT = (
              "CertTrace-ReleaseNotify/1.0 "
              "(https://github.com/SubtractManufacturing/certtrace)"
          )

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          tag_name = os.environ["TAG_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")

          if not webhook_url:
              print("DISCORD_WEBHOOK_URL is not set", file=sys.stderr)
              sys.exit(1)

          if not tag_name.startswith("desktop-v"):
              print(f"Unsupported tag: {tag_name}", file=sys.stderr)
              sys.exit(1)

          version = tag_name.removeprefix("desktop-v")
          owner, repo_name = repo.split("/", 1)

          def http_json(url, headers=None):
              merged = {"User-Agent": USER_AGENT, **(headers or {})}
              request = urllib.request.Request(url, headers=merged)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def parse_pub_date(pub_date_str):
              return datetime.fromisoformat(pub_date_str.replace("Z", "+00:00"))

          def seconds_until_release_ready(pub_date):
              ready_at = pub_date + timedelta(seconds=RELEASE_READY_AGE_SEC)
              return (ready_at - datetime.now(timezone.utc)).total_seconds()

          latest_json_url = (
              f"https://github.com/{repo}/releases/download/{tag_name}/latest.json"
          )

          while True:
              print(f"Fetching {latest_json_url}")
              latest = http_json(latest_json_url)

              pub_date_str = latest.get("pub_date")
              if not pub_date_str:
                  print("latest.json is missing pub_date", file=sys.stderr)
                  sys.exit(1)

              remaining = seconds_until_release_ready(parse_pub_date(pub_date_str))
              if remaining <= 0:
                  print("Release is ready (pub_date + 30m has elapsed)")
                  break

              sleep_for = min(POLL_INTERVAL_SEC, remaining)
              print(
                  f"Release not ready yet; {remaining:.0f}s remaining "
                  f"(polling again in {sleep_for:.0f}s)"
              )
              time.sleep(sleep_for)

          release_api_url = (
              f"https://api.github.com/repos/{owner}/{repo_name}/releases/tags/{tag_name}"
          )
          release = http_json(
              release_api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          release_body = (release.get("body") or "").strip()
          release_url = f"https://github.com/{repo}/releases/tag/{tag_name}"

          description = release_body
          if len(description) > DISCORD_DESC_LIMIT:
              description = description[: DISCORD_DESC_LIMIT - 1] + "…"

          payload = {
              "username": "CertTrace",
              "embeds": [
                  {
                      "title": f"Version {version} is now available",
                      "description": description,
                      "url": release_url,
                      "color": EMBED_COLOR,
                  }
              ],
          }

          data = json.dumps(payload).encode("utf-8")
          with tempfile.NamedTemporaryFile(mode="wb", suffix=".json", delete=False) as payload_file:
              payload_file.write(data)
              payload_path = payload_file.name

          try:
              result = subprocess.run(
                  [
                      "curl",
                      "-fsS",
                      "-X",
                      "POST",
                      "-H",
                      "Content-Type: application/json",
                      "-d",
                      f"@{payload_path}",
                      webhook_url,
                  ],
                  capture_output=True,
                  text=True,
              )
          finally:
              os.unlink(payload_path)

          if result.returncode != 0:
              print(
                  "Discord webhook failed:\n"
                  f"stdout: {result.stdout}\n"
                  f"stderr: {result.stderr}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("Discord webhook accepted")
          PYTHON
