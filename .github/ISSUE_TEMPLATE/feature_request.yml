---
name: Feature request
description: Suggest an improvement or new capability
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What job-shop workflow does this help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should CertTrace behave?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This fits local-first / filesystem-backed design (no required server)
          required: false
        - label: This can work fully offline
          required: false
